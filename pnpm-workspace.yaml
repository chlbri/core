packages:
  - 'packages/core'
  - 'packages/__tests__/project1'

allowBuilds:
  esbuild: true

nodeLinker: hoisted
hoistingLimits: workspaces

minimumReleaseAge: 300

minimumReleaseAgeExclude:
  - '@bemedev/*'
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'

overrides:
  typescript: 6.0.3

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

update:
  ignoreDeps:
    - pnpm

catalog:
  # Bemedev packages
  '@bemedev/codebase': '^2.9.0'
  '@bemedev/dev-utils': '^1.6.2'

  # Types
  '@types/edit-json-file': '1.7.4'
  '@types/node': ^26.6.9
  '@types/shelljs': '^0.10.0'

  # Build, lint and test tooling
  '@size-limit/file': '^14.3.0'
  '@vitest/coverage-v8': 5.1.1
  '@vitest/ui': 5.1.1
  husky: '^9.1.7'
  onchange: '^7.1.0'
  size-limit: '^14.3.0'
  typescript: '7.0.2'
  vite: 'npm:@voidzero-dev/vite-plus-core@8.3.8001'
  vite-plus: '1.8.0'
  vitest: 5.1.1

  # Source dependencies
  cmd-ts: '^0.15.0'
  edit-json-file: '^1.8.1'
  shelljs: '^0.10.0'
  ts-morph: '^28.0.0'
  valibot: '^1.5.0'
